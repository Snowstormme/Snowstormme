<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
  <title id="title">Contribution graph design preview</title>
  <desc id="desc">A dark glass contribution dashboard with a twelve-month activity heatmap and release milestones.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1080" height="300" rx="22" fill="url(#bg)"/>
  <circle cx="1010" cy="-10" r="190" fill="#14b8a6" opacity=".08"/>
  <circle cx="880" cy="315" r="170" fill="#3b82f6" opacity=".08"/>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <text x="34" y="42" fill="#f8fafc" font-size="21" font-weight="700">Contribution cockpit</text>
    <text x="34" y="66" fill="#94a3b8" font-size="12">A visual preview · live GitHub data will replace these cells</text>

    <g filter="url(#shadow)">
      <rect x="34" y="88" width="760" height="174" rx="16" fill="#0f172a" stroke="#263449"/>
      <rect x="816" y="88" width="230" height="174" rx="16" fill="#0f172a" stroke="#263449"/>
    </g>

    <text x="58" y="116" fill="#cbd5e1" font-size="12" font-weight="600">activity · last 12 months</text>
    <text x="842" y="116" fill="#cbd5e1" font-size="12" font-weight="600">ship log</text>

    <g fill="#64748b" font-size="10">
      <text x="58" y="145">Mon</text><text x="58" y="176">Wed</text><text x="58" y="207">Fri</text>
      <text x="98" y="238">Jan</text><text x="218" y="238">Mar</text><text x="338" y="238">May</text>
      <text x="458" y="238">Jul</text><text x="578" y="238">Sep</text><text x="698" y="238">Nov</text>
    </g>

    <g transform="translate(100 132)">
      <rect width="11" height="11" rx="3" fill="#172033"/>
      <g fill="#134e4a">
        <rect x="18" y="0" width="11" height="11" rx="3"/><rect x="36" y="16" width="11" height="11" rx="3"/><rect x="54" y="32" width="11" height="11" rx="3"/>
        <rect x="72" y="0" width="11" height="11" rx="3"/><rect x="90" y="32" width="11" height="11" rx="3"/><rect x="108" y="16" width="11" height="11" rx="3"/>
        <rect x="126" y="48" width="11" height="11" rx="3"/><rect x="144" y="0" width="11" height="11" rx="3"/><rect x="162" y="16" width="11" height="11" rx="3"/>
        <rect x="180" y="32" width="11" height="11" rx="3"/><rect x="198" y="48" width="11" height="11" rx="3"/><rect x="216" y="16" width="11" height="11" rx="3"/>
        <rect x="234" y="0" width="11" height="11" rx="3"/><rect x="252" y="32" width="11" height="11" rx="3"/><rect x="270" y="48" width="11" height="11" rx="3"/>
        <rect x="288" y="16" width="11" height="11" rx="3"/><rect x="306" y="0" width="11" height="11" rx="3"/><rect x="324" y="32" width="11" height="11" rx="3"/>
        <rect x="342" y="16" width="11" height="11" rx="3"/><rect x="360" y="48" width="11" height="11" rx="3"/><rect x="378" y="0" width="11" height="11" rx="3"/>
        <rect x="396" y="32" width="11" height="11" rx="3"/><rect x="414" y="16" width="11" height="11" rx="3"/><rect x="432" y="48" width="11" height="11" rx="3"/>
        <rect x="450" y="0" width="11" height="11" rx="3"/><rect x="468" y="16" width="11" height="11" rx="3"/><rect x="486" y="32" width="11" height="11" rx="3"/>
        <rect x="504" y="48" width="11" height="11" rx="3"/><rect x="522" y="0" width="11" height="11" rx="3"/><rect x="540" y="16" width="11" height="11" rx="3"/>
        <rect x="558" y="32" width="11" height="11" rx="3"/><rect x="576" y="48" width="11" height="11" rx="3"/><rect x="594" y="16" width="11" height="11" rx="3"/>
        <rect x="612" y="0" width="11" height="11" rx="3"/><rect x="630" y="32" width="11" height="11" rx="3"/><rect x="648" y="16" width="11" height="11" rx="3"/>
      </g>
      <g fill="#2dd4bf">
        <rect x="72" y="16" width="11" height="11" rx="3"/><rect x="126" y="16" width="11" height="11" rx="3"/><rect x="198" y="32" width="11" height="11" rx="3"/>
        <rect x="270" y="16" width="11" height="11" rx="3"/><rect x="342" y="48" width="11" height="11" rx="3"/><rect x="414" y="32" width="11" height="11" rx="3"/>
        <rect x="486" y="0" width="11" height="11" rx="3"/><rect x="558" y="48" width="11" height="11" rx="3"/><rect x="630" y="16" width="11" height="11" rx="3"/>
      </g>
      <g fill="#60a5fa">
        <rect x="108" y="32" width="11" height="11" rx="3"/><rect x="234" y="16" width="11" height="11" rx="3"/><rect x="378" y="32" width="11" height="11" rx="3"/>
        <rect x="522" y="32" width="11" height="11" rx="3"/><rect x="594" y="0" width="11" height="11" rx="3"/>
      </g>
    </g>

    <g font-size="11">
      <circle cx="838" cy="142" r="4" fill="#2dd4bf"/><text x="850" y="146" fill="#cbd5e1">Tennisd 0.11.0</text>
      <circle cx="838" cy="174" r="4" fill="#60a5fa"/><text x="850" y="178" fill="#cbd5e1">177 tests passing</text>
      <circle cx="838" cy="206" r="4" fill="#64748b"/><text x="850" y="210" fill="#cbd5e1">Next milestone</text>
      <text x="838" y="241" fill="#64748b" font-size="10">Updated automatically</text>
    </g>
  </g>
</svg>
