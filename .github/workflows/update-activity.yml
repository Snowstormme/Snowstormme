name: Update contribution cockpit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Check out source repositories
        run: |
          mkdir -p /tmp/profile-sources
          git clone --quiet --filter=blob:none https://github.com/Snowstormme/tennisd.git /tmp/profile-sources/tennisd
          git clone --quiet --filter=blob:none https://github.com/Snowstormme/movie-finder.git /tmp/profile-sources/movie-finder
          git clone --quiet --filter=blob:none https://github.com/Snowstormme/lotus.git /tmp/profile-sources/lotus
      - name: Build real activity data
        run: python3 scripts/build_activity.py --sources /tmp/profile-sources --output assets
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/activity-data.json assets/contribution-graph.svg
          git diff --cached --quiet && exit 0
          git commit -m "Update contribution cockpit"
          git push
