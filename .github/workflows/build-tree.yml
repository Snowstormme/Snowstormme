name: Build Christmas Tree

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      theme:
        description: "Background theme"
        type: choice
        default: winter
        options: [default, space, winter, sky]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Merry Gitmas tree
        uses: chromeheartz/merry-gitmas@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: Snowstormme
          theme: ${{ inputs.theme || 'winter' }}
          width: 350
          output: profile-tree.svg
      - name: Remove profile labels
        run: |
          perl -0pi -e 's#\s*<text x="20" y="40"[^>]*>[^<]*</text>##g; s#\s*<text x="20" y="654"[^>]*>[^<]*</text>##g' profile-tree.svg
      - name: Commit SVG
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update christmas tree 🎄"
          file_pattern: profile-tree.svg
